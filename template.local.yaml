AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    MemorySize: 128
    Architectures: ["x86_64"]
    Handler: bootstrap
    Runtime: go1.x
    Timeout: 5
    Tracing: Active
    Environment:
      Variables:
        TABLE: !Ref Table
        DYNAMODB_ENDPOINT: ""
        AWS_REGION: !Ref AWS::Region
        PROFILE: ""
        CLIENT_ID: !Ref ClientId
        CLIENT_SECRET: !Ref ClientSecret
  Api:
    Cors:
      AllowOrigins:
        - http://localhost:3000
      AllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      AllowHeaders:
        - Content-Type
        - Authorization

Parameters:
  ClientId:
    Type: String
    Default: ""
  ClientSecret:
    Type: String
    Default: ""

Resources:
  GetProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/get-product/
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{id}
            Method: GET
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt Table.Arn

  PutProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/put-product/
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{id}
            Method: PUT
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt Table.Arn
  
  AuthUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/auth-user/
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /auth/signup
            Method: POST
        OptionsEvent:
          Type: HttpApi
          Properties:
            Path: /auth/signup
            Method: OPTIONS
      Environment:
        Variables:
          AUTH_TABLE: ChatAppAuth
          DYNAMODB_ENDPOINT: http://host.docker.internal:8000
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt Table.Arn

  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/auth-login/
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /auth/login
            Method: POST
        OptionsEvent:
          Type: HttpApi
          Properties:
            Path: /auth/login
            Method: OPTIONS
      Environment:
        Variables:
          AUTH_TABLE: ChatAppAuth
          DYNAMODB_ENDPOINT: http://host.docker.internal:8000
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt Table.Arn

  CreateRoomFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/create-room/
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /user/rooms
            Method: POST
        OptionsEvent:
          Type: HttpApi
          Properties:
            Path: /user/rooms
            Method: OPTIONS
      Environment:
        Variables:
          ROOM_TABLE: ChatAppRooms
          MEMBERS_TABLE: ChatAppRoomMembers
          DYNAMODB_ENDPOINT: http://host.docker.internal:8000
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !GetAtt RoomTable.Arn
                - !GetAtt RoomMembersTable.Arn

  GetRoomFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/get-room/
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /user/rooms/{room_id}
            Method: GET
        OptionsEvent:
          Type: HttpApi
          Properties:
            Path: /user/rooms/{room_id}
            Method: OPTIONS
      Environment:
        Variables:
          ROOM_TABLE: ChatAppRooms
          MEMBERS_TABLE: ChatAppRoomMembers
          DYNAMODB_ENDPOINT: http://host.docker.internal:8000
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt RoomTable.Arn
                - !GetAtt RoomMembersTable.Arn

  GetUserRoomsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/get-user-rooms/
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /rooms/user
            Method: GET
        ApiUserRooms:
          Type: HttpApi
          Properties:
            Path: /user/rooms
            Method: GET
        OptionsEvent:
          Type: HttpApi
          Properties:
            Path: /rooms/user
            Method: OPTIONS
      Environment:
        Variables:
          ROOM_TABLE: ChatAppRooms
          MEMBERS_TABLE: ChatAppRoomMembers
          DYNAMODB_ENDPOINT: http://host.docker.internal:8000
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt RoomTable.Arn
                - !GetAtt RoomMembersTable.Arn
                - !Sub "${RoomMembersTable.Arn}/index/*"

  GetMessagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/get-messages/
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /rooms/{room_id}/messages
            Method: GET
        OptionsEvent:
          Type: HttpApi
          Properties:
            Path: /rooms/{room_id}/messages
            Method: OPTIONS
      Environment:
        Variables:
          MESSAGES_TABLE: ChatAppMessages
          DYNAMODB_ENDPOINT: http://host.docker.internal:8000
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt MessagesTable.Arn

  RoomTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ChatAppRooms
      AttributeDefinitions:
        - AttributeName: room_id
          AttributeType: S
      KeySchema:
        - AttributeName: room_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  RoomMembersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ChatAppRoomMembers
      AttributeDefinitions:
        - AttributeName: room_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: room_id
          KeyType: HASH
        - AttributeName: user_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserRoomsIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: room_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ChatAppMessages
      AttributeDefinitions:
        - AttributeName: room_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: room_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  WebSocketConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ChatAppWebSocketConnections
      AttributeDefinitions:
        - AttributeName: connection_id
          AttributeType: S
        - AttributeName: room_id
          AttributeType: S
      KeySchema:
        - AttributeName: connection_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: RoomConnectionsIndex
          KeySchema:
            - AttributeName: room_id
              KeyType: HASH
            - AttributeName: connection_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Ref AWS::StackName

  HttpApiCorsConfig:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: ServerlessHttpApi
    Properties:
      ApiId: !Ref ServerlessHttpApi
      StageName: "$default"

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
