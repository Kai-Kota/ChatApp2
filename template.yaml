AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    MemorySize: 128
    Architectures: ["x86_64"]
    Handler: bootstrap
    Runtime: go1.x
    Timeout: 5
    Tracing: Active
    Environment:
      Variables:
        TABLE: !Ref Table
        DYNAMODB_ENDPOINT: ""
        AWS_REGION: !Ref AWS::Region
        PROFILE: ""
        CLIENT_ID: !Ref ClientId
        CLIENT_SECRET: !Ref ClientSecret
  Api:
    Cors:
      AllowOrigins:
        - http://localhost:3000
      AllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      AllowHeaders:
        - Content-Type
        - Authorization

Resources:
  GetProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/get-product/
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{id}
            Method: GET
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt Table.Arn

  PutProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/put-product/
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{id}
            Method: PUT
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt Table.Arn
  
  AuthUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/auth-user/
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /auth/signup
            Method: POST
        OptionsEvent:
          Type: HttpApi
          Properties:
            Path: /auth/signup
            Method: OPTIONS
      Environment:
        Variables:
          AUTH_TABLE: ChatAppAuth
          DYNAMODB_ENDPOINT: http://host.docker.internal:8000
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt Table.Arn

  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/auth-login/
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /auth/login
            Method: POST
        OptionsEvent:
          Type: HttpApi
          Properties:
            Path: /auth/login
            Method: OPTIONS
      Environment:
        Variables:
          AUTH_TABLE: ChatAppAuth
          DYNAMODB_ENDPOINT: http://host.docker.internal:8000
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt Table.Arn

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Ref AWS::StackName

  HttpApiCorsConfig:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: ServerlessHttpApi
    Properties:
      ApiId: !Ref ServerlessHttpApi
      StageName: "$default"

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
